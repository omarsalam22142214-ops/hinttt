        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.3s, color 0.3s; }

        .loading { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .spare-pieces-7492f { margin: 15px 0; display: flex; justify-content: center; gap: 10px; }
        
        .highlight-move {
            box-shadow: inset 0 0 0 100px rgba(255, 255, 51, 0.5) !important;
        }
        
        .digital-font { font-family: 'Courier New', Courier, monospace; }

        /* =========================================
            مؤشرات النقلات القانونية 
        ========================================= */
        .legal-move-hint { position: relative; }
        .legal-move-hint::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 25%; height: 25%; background-color: rgba(0, 0, 0, 0.25); border-radius: 50%; pointer-events: none;
            z-index: 2;
        }
        .theme-dark .legal-move-hint::after, .theme-neon .legal-move-hint::after { 
            background-color: rgba(255, 255, 255, 0.25); 
        }
        
        .capture-hint::after {
            width: 80%; height: 80%; background-color: transparent; border: 5px solid rgba(0, 0, 0, 0.25);
        }
        .theme-dark .capture-hint::after, .theme-neon .capture-hint::after { 
            border-color: rgba(255, 255, 255, 0.25); 
        }

        .theme-purple .white-1e1d7 { background-color: #efdfef !important; color: #8877b7 !important; }

        .theme-cherry .white-1e1d7 { background-color: #f0d9b5 !important; color: #ba5546 !important; }

        .theme-dark .white-1e1d7 { background-color: #6b7280 !important; color: #374151 !important; }

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');
        var fenHistory = [];
        var redoHistory = []; 
        var isCalculating = false;
        
        var currentAjaxRequest = null;
        var $activeBtn = null;
        var activeBtnOriginalClass = '';
        var activeBtnOriginalText = '';

        var timerSeconds = 0;
        var timerInterval = null;
        var isTimerRunning = false;

        var isAutoWhiteFree = false;
        var isAutoBlackFree = false;
        
        var clickSourceSquare = null; 

        function formatTime(sec) {
            var m = Math.floor(sec / 60).toString().padStart(2, '0');
            var s = (sec % 60).toString().padStart(2, '0');
            return m + ':' + s;
        }

        function startTimer() {
            if (!isTimerRunning) {
                isTimerRunning = true;
                timerInterval = setInterval(function() {
                    timerSeconds++;
                    $('#timerDisplay').text(formatTime(timerSeconds));
                }, 1000);
            }
        }

        function stopTimer() {
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
            }
        }

        function resetTimer() {
            stopTimer();
            timerSeconds = 0;
            $('#timerDisplay').text('00:00');
        }

        var moveSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move-self.mp3');
        var captureSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/capture.mp3');
        var checkSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/check.mp3');
        var gameEndSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/game-end.mp3');
        
        var isSoundEnabled = true;

        function playMoveSound(isCapture) {
            if (!isSoundEnabled) return;

            if (game.game_over()) {
                gameEndSound.play().catch(function(){});
            } else if (game.in_check()) {
                checkSound.play().catch(function(){});
            } else if (isCapture) {
                captureSound.play().catch(function(){});
            } else {
                moveSound.play().catch(function(){});
            }
        }

        function removeHighlights() {
            $('.highlight-move').removeClass('highlight-move');
            $('#myBoard .square-55d63').removeClass('legal-move-hint capture-hint'); // بتمسح النقط كمان
        }

        function highlightMove(source, target) {
            removeHighlights();
            if (source && source !== 'spare' && source !== 'offboard') {
                $('#myBoard .square-' + source).addClass('highlight-move');
            }
            if (target && target !== 'offboard') {
                $('#myBoard .square-' + target).addClass('highlight-move');
            }
        }

        // دالة جديدة لرسم دوائر النقلات المتاحة
        function showLegalMoves(square) {
            var moves = game.moves({ square: square, verbose: true });
            if (moves.length === 0) return false;

            for (var i = 0; i < moves.length; i++) {
                var targetSq = moves[i].to;
                var isCapture = game.get(targetSq) !== null;
                var $sq = $('#myBoard .square-' + targetSq);
                
                $sq.addClass('legal-move-hint');
                if (isCapture) {
                    $sq.addClass('capture-hint');
                }
            }
            return true;
        }

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            if (isCalculating) return false; 

            var mode = $('input[name="playMode"]:checked').val();
            
            if (mode === 'white' && game.turn() === 'w') return false;
            if (mode === 'black' && game.turn() === 'b') return false;

            if (mode === 'white' && piece.search(/^w/) !== -1) return false; 
            if (mode === 'black' && piece.search(/^b/) !== -1) return false; 

            // لما يسحب القطعة، ارسم النقط برضه
            clickSourceSquare = source;
            highlightMove(source, null);
            showLegalMoves(source);
        }

        function onDrop (source, target, piece, newPos, oldPos, orientation) {
            clickSourceSquare = null; 
            if (source === target) return 'snapback';
            
            startTimer();
            fenHistory.push(game.fen());
            redoHistory = []; 

            var isCapture = false;

            if (source === 'spare') {
                isCapture = game.get(target) !== null;
                game.put({ type: piece[1].toLowerCase(), color: piece[0] }, target);
            } 
            else if (target === 'offboard') {
                game.remove(source);
            } 
            else {
                var tempMove = game.move({ from: source, to: target, promotion: 'q' });
                if (tempMove !== null) {
                    isCapture = tempMove.captured != null;
                    game.undo(); 
                } else {
                    isCapture = game.get(target) !== null;
                }

                var move = game.move({ from: source, to: target, promotion: 'q' });
                if (move === null) {
                    game.remove(source);
                    game.put({ type: piece[1].toLowerCase(), color: piece[0] }, target);
                }
            }

            updateStatus();
            highlightMove(source, target);
            playMoveSound(isCapture);

            var mode = $('input[name="playMode"]:checked').val();
            
            if ((mode === 'white' && game.turn() === 'w' && !game.game_over()) || 
                (mode === 'black' && game.turn() === 'b' && !game.game_over()) ||
                (mode === 'auto' && !game.game_over()) ||
                (mode === 'free' && isAutoWhiteFree && game.turn() === 'w' && !game.game_over()) ||
                (mode === 'free' && isAutoBlackFree && game.turn() === 'b' && !game.game_over())) {
                setTimeout(makeComputerMove, 400); 
            }
        }

        function onSnapEnd () {
            board.position(game.fen(), false);
        }

        function updateStatus () {
            var statusHTML = '';
            var moveColor = (game.turn() === 'w') ? 'الأبيض' : 'الأسود';

            if (game.in_checkmate()) {
                statusHTML = 'كش مات! الفائز: ' + (moveColor === 'الأبيض' ? 'الأسود' : 'الأبيض');
                $status.removeClass('text-blue-600 dark:text-blue-300 text-yellow-600 dark:text-yellow-400').addClass('text-red-500');
                stopTimer();
            } 
            else if (game.in_draw()) {
                statusHTML = 'وضع تعادل!';
                $status.removeClass('text-red-500 text-blue-600 dark:text-blue-300 text-yellow-600 dark:text-yellow-400').addClass('text-gray-500');
                stopTimer();
            } 
            else {
                statusHTML = 'الدور على: ' + moveColor;
                $status.removeClass('text-red-500 text-gray-500');
                if(moveColor === 'الأبيض'){
                    $status.removeClass('text-yellow-600 dark:text-yellow-400').addClass('text-blue-600 dark:text-blue-300');
                } else {
                    $status.removeClass('text-blue-600 dark:text-blue-300').addClass('text-yellow-600 dark:text-yellow-400');
                }
                
                if (game.in_check()) {
                    statusHTML += ' <span class="text-red-500 text-sm ml-2">(كش ملك!)</span>';
                }
            }

            $status.html(statusHTML);
        }

        var config = {
            draggable: true,
            position: 'start',
            sparePieces: true,       
            dropOffBoard: 'trash',   
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };
        
        board = Chessboard('myBoard', config);
        updateStatus();

        $(window).on('resize', function() {
            if (board !== null) board.resize();
        });

        $('#themeSelect').on('change', function() {
            var selectedTheme = $(this).val();
            $('#myBoard').removeClass(function (index, className) {
                return (className.match (/(^|\s)theme-\S+/g) || []).join(' ');
            });
            $('#myBoard').addClass(selectedTheme);
        });

        $('#pieceThemeSelect').on('change', function() {
            var selectedPieceTheme = $(this).val();
            var currentFen = game.fen();
            var currentOrientation = board.orientation();
            
            config.pieceTheme = selectedPieceTheme;
            config.position = currentFen;
            
            board = Chessboard('myBoard', config);
            board.orientation(currentOrientation);
            removeHighlights();
        });

        $('#soundToggleBtn').on('click', function() {
            isSoundEnabled = !isSoundEnabled;
            $(this).text(isSoundEnabled ? '🔊' : '🔇');
        });

        $('input[name="playMode"]').on('change', function() {
            var mode = $(this).val();
            
            if (mode === 'free') {
                $('#quickPlayButtons').slideDown();
            } else {
                $('#quickPlayButtons').slideUp();
            }

            if (mode === 'white') {
                board.orientation('white');
                if (game.turn() === 'w') makeComputerMove(); 
            } else if (mode === 'black') {
                board.orientation('black');
                if (game.turn() === 'b') makeComputerMove();
            }
        });

        $('#flipBtn').on('click', function() { board.flip(); });

        function resetAnalysis() {
            $('#whiteMoveDisplay').text('--');
            $('#blackMoveDisplay').text('--');
            $('#evalDisplay').text('--');
        }

        $('#resetBtn').on('click', function() {
            if(isCalculating) return; 
            clickSourceSquare = null; 
            fenHistory.push(game.fen());
            redoHistory = []; 
            game.reset();
            board.start();
            updateStatus();
            removeHighlights();
            resetTimer();
            resetAnalysis();
            
            var mode = $('input[name="playMode"]:checked').val();
            if (mode === 'white') makeComputerMove();
        });

        $('#clearBtn').on('click', function() {
            if(isCalculating) return;
            clickSourceSquare = null; 
            fenHistory.push(game.fen());
            redoHistory = []; 
            game.clear();
            board.clear();
            updateStatus();
            removeHighlights();
            resetTimer();
            resetAnalysis();
        });

        $('#undoBtn').off('click').on('click', function() {
            if(isCalculating || fenHistory.length === 0) return;
            clickSourceSquare = null;
            redoHistory.push(game.fen()); 
            var lastFen = fenHistory.pop();
            game.load(lastFen);              
            board.position(game.fen());     
            updateStatus();
            removeHighlights(); 
            resetAnalysis();
            if (!game.game_over() && timerSeconds > 0) startTimer();
        });

        $('#redoBtn').on('click', function() {
            if(isCalculating || redoHistory.length === 0) return;
            clickSourceSquare = null;
            fenHistory.push(game.fen()); 
            var nextFen = redoHistory.pop();
            game.load(nextFen);              
            board.position(game.fen());     
            updateStatus();
            removeHighlights(); 
            resetAnalysis();
            if (!game.game_over() && timerSeconds > 0) startTimer();
        });

        $('#stopCalcBtn').on('click', function() {
            if (currentAjaxRequest) {
                currentAjaxRequest.abort();
                currentAjaxRequest = null;
            }
            if ($activeBtn) {
                $activeBtn.attr('class', activeBtnOriginalClass).removeClass('loading').prop('disabled', false);
                $activeBtn.html(activeBtnOriginalText);
            }
            $(this).hide();
            isCalculating = false;
        });

        function calculateForColor(colorToMove) {
            if (isCalculating || game.game_over()) return;
            
            var $btn = colorToMove === 'w' ? $('#calcWhiteBtn') : $('#calcBlackBtn');
            var originalText = colorToMove === 'w' ? '⚪ إحسب أفضل حركة للأبيض' : '⚫ إحسب أفضل حركة للأسود';
            var btnClasses = $btn.attr('class');

            $activeBtn = $btn;
            activeBtnOriginalClass = btnClasses;
            activeBtnOriginalText = originalText;

            var fenParts = game.fen().split(' ');
            if (fenParts[1] !== colorToMove) {
                fenHistory.push(game.fen()); 
                redoHistory = []; 
                fenParts[1] = colorToMove;
                fenParts[3] = '-'; 
                game.load(fenParts.join(' '));
                updateStatus();
                removeHighlights();
            }

            var currentFen = game.fen();
            var currentTurn = game.turn();
            
            if (!currentFen.includes('K') || !currentFen.includes('k')) {
                $btn.attr('class', 'w-full bg-red-600 text-white py-3 px-4 rounded border border-red-700 transition font-bold text-lg mb-0 shadow-md');
                $btn.html('⚠️ حط الملوك الأول!');
                setTimeout(function() {
                    $btn.attr('class', btnClasses);
                    $btn.html(originalText);
                }, 2500);
                return;
            }

            startTimer();
            isCalculating = true;
            $btn.html('🤔 جاري التفكير...').addClass('loading').prop('disabled', true);
            $('#stopCalcBtn').show(); 

            var selectedDepth = $('#engineLevel').val() || '15';
            var apiUrl = 'https://stockfish.online/api/s/v2.php?fen=' + encodeURIComponent(currentFen) + '&depth=' + selectedDepth;

            currentAjaxRequest = $.ajax({
                url: apiUrl,
                method: 'GET',
                success: function(response) {
                    $('#stopCalcBtn').hide();
                    currentAjaxRequest = null;

                    if(response.success) {
                        var bestMoveParts = response.bestmove.split(' ');
                        var bestMoveText = bestMoveParts[1] || '--';
                        var ponderMoveText = bestMoveParts[3] || '--'; 
                        
                        var evalScore = response.evaluation !== null ? response.evaluation : '--';
                        if (response.mate !== null) {
                            evalScore = 'كش مات بعد ' + Math.abs(response.mate);
                        }

                        if (currentTurn === 'w') {
                            $('#whiteMoveDisplay').text(bestMoveText);
                            $('#blackMoveDisplay').text(ponderMoveText);
                        } else {
                            $('#blackMoveDisplay').text(bestMoveText);
                            $('#whiteMoveDisplay').text(ponderMoveText);
                        }
                        $('#evalDisplay').text(evalScore);

                        fenHistory.push(game.fen()); 
                        redoHistory = [];
                        var bestMoveString = bestMoveParts[1]; 
                        
                        var fromSq = bestMoveString.substring(0, 2);
                        var toSq = bestMoveString.substring(2, 4);
                        
                        var theMove = game.move(bestMoveString, { sloppy: true });
                        var isCapture = (theMove && theMove.captured != null);
                        
                        board.position(game.fen());
                        updateStatus();

                        highlightMove(fromSq, toSq);
                        playMoveSound(isCapture);
                        
                        $btn.attr('class', btnClasses).removeClass('loading').prop('disabled', false);
                        $btn.html(originalText);

                        var currentMode = $('input[name="playMode"]:checked').val();
                        if ((currentMode === 'auto' && !game.game_over()) ||
                            (currentMode === 'free' && isAutoWhiteFree && game.turn() === 'w' && !game.game_over()) ||
                            (currentMode === 'free' && isAutoBlackFree && game.turn() === 'b' && !game.game_over())) {
                            setTimeout(makeComputerMove, 400);
                        }

                    } else {
                        $btn.attr('class', 'w-full bg-red-600 text-white py-3 px-4 rounded border border-red-700 transition font-bold text-lg mb-0 shadow-md');
                        $btn.html('⚠️ رصة غير قانونية');
                        setTimeout(function() { 
                            $btn.attr('class', btnClasses).prop('disabled', false);
                            $btn.html(originalText);
                        }, 2500);
                    }
                    isCalculating = false;
                },
                error: function(jqXHR, textStatus) {
                    if (textStatus === 'abort') return; 

                    $('#stopCalcBtn').hide();
                    currentAjaxRequest = null;
                    
                    $btn.attr('class', 'w-full bg-red-600 text-white py-3 px-4 rounded border border-red-700 transition font-bold text-lg mb-0 shadow-md');
                    $btn.html('❌ السيرفر مشغول حالياً');
                    setTimeout(function() { 
                        $btn.attr('class', btnClasses).prop('disabled', false);
                        $btn.html(originalText);
                    }, 2500);
                    isCalculating = false;
                }
            });
        }

        $('#calcWhiteBtn').on('click', function() { calculateForColor('w'); });
        $('#calcBlackBtn').on('click', function() { calculateForColor('b'); });
        
        $('#quickWhiteBtn').off('click').on('click', function() {
            isAutoWhiteFree = !isAutoWhiteFree;
            if (isAutoWhiteFree) {
                $(this).removeClass('bg-gray-100 text-gray-800 border-gray-400').addClass('bg-green-500 text-white border-green-600').html('<span>✅ أبيض (تلقائي)</span>');
                if (game.turn() === 'w' && !game.game_over() && !isCalculating) makeComputerMove();
            } else {
                $(this).removeClass('bg-green-500 text-white border-green-600').addClass('bg-gray-100 text-gray-800 border-gray-400').html('<span>🤖 العب أبيض</span>');
            }
        });

        $('#quickBlackBtn').off('click').on('click', function() {
            isAutoBlackFree = !isAutoBlackFree;
            if (isAutoBlackFree) {
                $(this).removeClass('bg-gray-800 text-white border-gray-600').addClass('bg-green-600 text-white border-green-700').html('<span>✅ أسود (تلقائي)</span>');
                if (game.turn() === 'b' && !game.game_over() && !isCalculating) makeComputerMove();
            } else {
                $(this).removeClass('bg-green-600 text-white border-green-700').addClass('bg-gray-800 text-white border-gray-600').html('<span>🤖 العب أسود</span>');
            }
        });

        function makeComputerMove() {
            calculateForColor(game.turn());
        }

        $('#pauseAutoPlayBtn').on('click', function() {
            if (currentAjaxRequest) {
                currentAjaxRequest.abort();
                currentAjaxRequest = null;
            }
            
            if ($activeBtn) {
                $activeBtn.attr('class', activeBtnOriginalClass).removeClass('loading').prop('disabled', false);
                $activeBtn.html(activeBtnOriginalText);
            }
            
            $('#stopCalcBtn').hide();
            isCalculating = false;

            isAutoWhiteFree = false;
            isAutoBlackFree = false;
            $('#quickWhiteBtn').removeClass('bg-green-500 text-white border-green-600').addClass('bg-gray-100 text-gray-800 border-gray-400').html('<span>🤖 العب أبيض</span>');
            $('#quickBlackBtn').removeClass('bg-green-600 text-white border-green-700').addClass('bg-gray-800 text-white border-gray-600').html('<span>🤖 العب أسود</span>');

            $('input[name="playMode"][value="free"]').prop('checked', true);
            $('#quickPlayButtons').slideDown();

            var currentStatus = $('#status').html();
            if (!currentStatus.includes('(تم الإيقاف)')) {
                $('#status').append(' <span class="text-orange-500 font-bold text-sm ml-2">⏸️ (تم الإيقاف - لعب حر)</span>');
            }
        });

        $('#extraResetBtn').on('click', function() { $('#resetBtn').click(); });
        $('#extraFlipBtn').on('click', function() { $('#flipBtn').click(); });
        $('#extraCaptureBtn').on('click', function() { $('#clearBtn').click(); });
        $('#arrowLeftBtn').on('click', function() { $('#undoBtn').click(); });
        $('#arrowRightBtn').on('click', function() { $('#redoBtn').click(); });

        var currentZoom = 1.0;
        $('#zoomInBtn').on('click', function() {
            currentZoom += 0.1;
            $('body').css('zoom', currentZoom);
        });
        $('#zoomOutBtn').on('click', function() {
            if (currentZoom > 0.3) {
                currentZoom -= 0.1;
                $('body').css('zoom', currentZoom);
            }
        });
        $('#zoomResetBtn').on('click', function() {
            currentZoom = 1.0;
            $('body').css('zoom', currentZoom);
        });

        // ----------------------------------------------------
        // نظام الضغط للتحريك (Click-to-Move) الذكي
        // ----------------------------------------------------
        $('#myBoard').on('click', '.square-55d63', function() {
            if (game.game_over() || isCalculating) return;

            var square = $(this).attr('data-square');
            var pieceOnSquare = game.get(square);
            var mode = $('input[name="playMode"]:checked').val();

            if (mode === 'white' && game.turn() === 'w') return;
            if (mode === 'black' && game.turn() === 'b') return;

            // الحالة الأولى: مفيش مربع متحدد
            if (clickSourceSquare === null) {
                if (pieceOnSquare === null) return;
                if (pieceOnSquare.color !== game.turn()) return;

                // لو القطعة ملهاش نقلات، متعملش حاجة
                var hasMoves = showLegalMoves(square);
                if (!hasMoves) return;

                clickSourceSquare = square;
                highlightMove(square, null);
                showLegalMoves(square); // إظهار الدوائر
            } 
            // الحالة التانية: في مربع متحدد أصلاً
            else {
                var targetSquare = square;

                // لو داس على نفس المربع تاني (إلغاء التحديد)
                if (clickSourceSquare === targetSquare) {
                    clickSourceSquare = null;
                    removeHighlights();
                    return;
                }

                // لو داس على قطعة تانية من نفس لونه (تغيير التحديد)
                if (pieceOnSquare && pieceOnSquare.color === game.turn()) {
                    var hasMoves = showLegalMoves(targetSquare);
                    if (!hasMoves) {
                        clickSourceSquare = null;
                        removeHighlights();
                        return;
                    }
                    clickSourceSquare = targetSquare;
                    highlightMove(targetSquare, null);
                    showLegalMoves(targetSquare);
                    return;
                }

                // محاولة تنفيذ النقلة
                var fenBeforeMove = game.fen();
                var move = game.move({
                    from: clickSourceSquare,
                    to: targetSquare,
                    promotion: 'q'
                });

                if (move === null) {
                    // نقلة غلط
                    clickSourceSquare = null;
                    removeHighlights();
                } else {
                    // النقلة تمت بنجاح
                    startTimer();
                    fenHistory.push(fenBeforeMove);
                    redoHistory = [];

                    board.position(game.fen());
                    updateStatus();
                    highlightMove(clickSourceSquare, targetSquare); // الدالة دي دلوقتي بتمسح دوائر التلميح لوحدها
                    playMoveSound(move.captured != null);

                    clickSourceSquare = null;

                    // رد الكمبيوتر لو النظام شغال
                    if ((mode === 'white' && game.turn() === 'w' && !game.game_over()) || 
                        (mode === 'black' && game.turn() === 'b' && !game.game_over()) ||
                        (mode === 'auto' && !game.game_over()) ||
                        (mode === 'free' && isAutoWhiteFree && game.turn() === 'w' && !game.game_over()) ||
                        (mode === 'free' && isAutoBlackFree && game.turn() === 'b' && !game.game_over())) {
                        setTimeout(makeComputerMove, 400);
                    }
                }
            }
        });

    </script><img src="https://chessboardjs.com/img/chesspieces/wikipedia/bQ.png" id="d637-3efc-e3bb-dc0a-86cd-cc35-9ab2-230c" alt="" class="piece-417db" data-piece="wP" style="width: 61px; height: 61px; position: absolute; left: 838.5px; top: 399.6px; display: none;">
